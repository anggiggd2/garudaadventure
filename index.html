<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Petualangan si Anak Garuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1030;--ink:#fff6e0;--acc:#ffb703;--pn:#2b1a4d;--f:"Lilita One","Luckiest Guy",Impact,"Arial Black",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#120a22}}
:root[data-theme=dark]{--bg:#120a22}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
body{display:flex;align-items:center;justify-content:center}
[hidden]{display:none!important}
#wrap{position:relative;width:min(100%,calc(100vh*1.778));aspect-ratio:16/9;overflow:hidden;background:#000}
#cv{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em}
button{font:inherit;font-family:var(--f);letter-spacing:.03em;font-weight:400;cursor:pointer;color:#3a1c00;background:linear-gradient(#ffd23f,#ff9f1c);border:0;border-bottom:.25em solid #b35c00;border-radius:.7em;padding:.5em 1.4em}
button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #fff}
button:disabled{opacity:.55}
h1{margin:0;font-size:3.6em;line-height:.95;text-align:center;color:#ffd23f;letter-spacing:.02em;text-shadow:0 .06em 0 #c1440e,0 .12em 0 #6b1d00,0 .2em .3em rgba(0,0,0,.5)}
h1 small{display:block;font-size:.5em;color:#fff;margin-top:.2em;text-shadow:0 .08em 0 #6b1d00}
.bt{display:flex;flex-direction:column;gap:.5em;width:15em}
#menu{background:linear-gradient(rgba(10,5,30,.1),rgba(10,5,30,.6))}
#panel,#quiz{background:rgba(10,5,30,.8)}
.card{background:var(--pn);border:.2em solid var(--acc);border-radius:1em;padding:1em 1.4em;max-width:34em;max-height:88%;overflow:auto;font-size:.85em;line-height:1.45;display:flex;flex-direction:column;gap:.6em}
.card h2{margin:0;color:var(--acc);font-size:1.5em}
.card input,.card select,.card textarea{font:inherit;width:100%;box-sizing:border-box;border-radius:.4em;border:1px solid #888;padding:.3em;background:#fff;color:#111}
.card textarea{height:9em;font-size:.8em}
.mp{display:flex;gap:.5em;flex-wrap:wrap}.mp button{flex:1;min-width:8em}
#qo{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
#qo button{background:#fff3d6;border-bottom-color:#c9a45a}
#qo .ok{background:#6bdc6b!important}#qo .bad{background:#ff7b7b!important}
#qt{font-size:1.15em;font-weight:700}
#home{position:absolute;right:8%;top:2%;padding:.3em .8em;font-size:.8em}
#fs{position:absolute;right:1%;top:2%;padding:.3em .7em;font-size:.8em}
#ctl{position:absolute;inset:0;display:none;pointer-events:none;z-index:5}
#stick{position:absolute;left:4%;bottom:7%;width:10.5em;height:10.5em;border-radius:50%;background:rgba(255,255,255,.14);border:.2em solid rgba(255,255,255,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:4.6em;height:4.6em;margin:-2.3em 0 0 -2.3em;border-radius:50%;background:radial-gradient(#fff,#ffd23f);border:.15em solid #b8860b;opacity:.92;pointer-events:none}
.ab{position:absolute;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;line-height:1;font-size:1em;opacity:.88;pointer-events:auto;touch-action:none;border-bottom-width:.2em}
.ab b{font-weight:400;font-size:1.7em}.ab small{font-family:var(--f);font-size:.62em;letter-spacing:.05em}
.ab.on{filter:brightness(1.3);transform:scale(.93)}
#bj{width:5.6em;height:5.6em;right:4%;bottom:7%}
#ba{width:4.8em;height:4.8em;right:17%;bottom:9%}
#brn{width:4.8em;height:4.8em;right:6%;bottom:32%}
#rot{position:fixed;inset:0;z-index:99;background:rgba(10,5,30,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;text-align:center;font-family:var(--f);font-size:5.5vw;padding:1em}
#rot i{font-style:normal;font-size:2.2em;display:inline-block;animation:rr 2.4s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
html,body{touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#wrap{width:min(100%,calc(100dvh*1.7778))}
@media(pointer:coarse){#home,#fs{font-size:1em;padding:.4em .9em}}

.card h2{font-family:var(--f);font-weight:400;letter-spacing:.04em}
#menu{flex-direction:row;justify-content:flex-end;padding:0 4%;box-sizing:border-box;background:linear-gradient(90deg,transparent 35%,rgba(20,6,50,.62))}
.mc{width:48%;display:flex;flex-direction:column;align-items:center;gap:.5em}
#menu h1{margin:0;font-family:var(--f);font-weight:400;font-size:4.3em;line-height:.95;letter-spacing:.03em;text-align:center;color:transparent;background:linear-gradient(#fffbd0,#ffd23f 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(.04em 0 0 #3a1260) drop-shadow(-.04em 0 0 #3a1260) drop-shadow(0 .04em 0 #3a1260) drop-shadow(0 -.04em 0 #3a1260) drop-shadow(0 .09em 0 #1c0838) drop-shadow(0 .2em .2em rgba(0,0,0,.5));animation:bob 2.6s ease-in-out infinite}
.rb{font-family:var(--f);font-size:1.9em;color:#fff;padding:.1em 1.4em .18em;background:linear-gradient(#ff5d6c,#c1121f);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);text-shadow:0 .08em 0 #7a0a14;letter-spacing:.05em;margin-top:-.1em}
.mc .bt{width:80%;margin-top:.6em}
.gb{display:flex;align-items:center;gap:.6em;font-size:1.05em;padding:.42em 1em;border-radius:.9em;border:.14em solid #3a1260;border-bottom-width:.3em;color:#fff;text-shadow:0 .08em 0 rgba(0,0,0,.45);background:linear-gradient(#9a6bff,#5a2fc9);text-align:left;transition:transform .12s,filter .12s}
.gb i{font-style:normal;width:1.4em;text-align:center}
.gb:hover{transform:translateX(-.35em);filter:brightness(1.15)}
.gb.pr{font-size:1.4em;justify-content:center;background:linear-gradient(#8bff6e,#1fb53a);color:#0d3b12;text-shadow:0 .06em 0 rgba(255,255,255,.55);animation:pulse 1.6s ease-in-out infinite}
#chip{position:absolute;left:3%;bottom:3%;font-family:var(--f);background:rgba(20,6,50,.75);border:.12em solid var(--acc);border-radius:2em;padding:.15em .9em;font-size:.9em}
@keyframes bob{50%{transform:translateY(-.12em) scale(1.02)}}@keyframes pulse{50%{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){#menu h1,.gb.pr{animation:none}}
.ig{display:grid;grid-template-columns:9em 1fr;gap:.7em}
.av{display:flex;flex-direction:column;align-items:center;gap:.3em;background:radial-gradient(#6b3fd6,#2b1a4d);border:.15em solid var(--acc);border-radius:.9em;padding:.6em}
.av img{height:7em}.av b{font-family:var(--f);font-weight:400;font-size:1.2em}
.bd,.xp{font-family:var(--f);font-size:.8em;background:#ffb703;color:#3a1c00;border-radius:2em;padding:.1em .8em;text-align:center}.xp{background:#4cd964}
.qs{display:flex;flex-direction:column;gap:.45em}
.qc{display:flex;gap:.6em;align-items:center;background:rgba(255,255,255,.08);border-left:.3em solid var(--acc);border-radius:.6em;padding:.4em .7em}
.qc i{font-style:normal;font-size:1.6em}.qc small{display:block;color:var(--acc);font-family:var(--f);letter-spacing:.04em}
.lv{display:flex;flex-wrap:wrap;gap:.4em}.lv span{font-size:.8em;background:rgba(255,255,255,.1);border-radius:2em;padding:.15em .8em}.lv .on{background:#4cd964;color:#0d3b12}
.gb.lk{filter:grayscale(.85) brightness(.85);animation:none}
.gb.hl{animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 1em #ffd23f}
.hint{font-family:var(--f);font-size:.95em;color:#ffd23f;text-align:center;text-shadow:0 .08em 0 #000}
#quiz .card{width:82%;max-width:none;font-size:1.12em;padding:1em 1.6em;gap:.8em}
#qk{font-family:var(--f);background:var(--acc);color:#3a1c00;border-radius:2em;padding:.05em .9em;align-self:flex-start;font-size:.78em;letter-spacing:.06em}
#qt{font-size:1.4em;line-height:1.3}
#qo button{padding:.65em .8em;font-size:1em;min-height:2.8em}
#qo.IS{grid-template-columns:1fr auto}#qo input{font-size:1.1em;padding:.5em}
#qe{font-size:1em}
</style></head><body>

<div id="menu" class="ov"><div class="mc"><h1>PETUALANGAN</h1><div class="rb">si Anak Garuda</div><div class="bt"><button class="gb pr" data-a="play"><i>▶</i>MULAI PETUALANGAN</button><button class="gb" data-a="help"><i>📜</i>PETUNJUK PERMAINAN</button><button class="gb" data-a="map"><i>🗺️</i>PETA PETUALANGAN</button><button class="gb" data-a="set"><i>⚙️</i>PENGATURAN</button><button class="gb" data-a="info"><i>🎓</i>INFORMASI PEMBELAJARAN</button></div><div id="hint" class="hint">🔒 Pilih jenjang di Pengaturan untuk membuka permainan</div></div><div id="chip"></div></div>
